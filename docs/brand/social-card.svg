<text x="58" y="144" fill="#B5A1E8" font-size="12" letter-spacing="3">THE EVIDENCE LAYER FOR AI CODING</text>
<text x="54" y="220" fill="#FFFFFF" font-size="60" font-weight="700" letter-spacing="-2">Less blind trust.</text>
<text x="54" y="292" fill="#BDA8FF" font-size="60" font-weight="700" letter-spacing="-2">More proof.</text>
<text x="58" y="341" fill="#C0BBCF" font-size="19">Your agents build. Aletheia checks the work.</text>
<text x="58" y="373" fill="#938CA6" font-size="16">Independent checks. Bounded recovery. Evidence you can inspect.</text>

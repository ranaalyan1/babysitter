<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img"><title>Aletheia — local supervision for AI coding agents</title><rect width="1200" height="630" fill="#16151E"/><g transform="translate(0 71) scale(.9375)"><defs><radialGradient id="glow"><stop stop-color="#473275"/><stop offset="1" stop-color="#16151E"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity=".035"/></pattern></defs>

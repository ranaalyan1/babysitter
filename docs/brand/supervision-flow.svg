<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" fill="none" role="img"><title>Observe, verify, recover, resolve — conceptual supervision flow</title><rect width="1200" height="290" rx="20" fill="#19191F"/><g font-family="Arial, sans-serif"><text x="38" y="43" fill="#BDA8FF" font-size="12" letter-spacing="2">FROM AGENT ACTIVITY TO INSPECTABLE EVIDENCE</text><rect x="38" y="75" width="254" height="135" rx="12" fill="#25222F" stroke="#433953"/><text x="58" y="106" fill="#BDA8FF" font-size="13">01</text><text x="58" y="144" fill="#FFFFFF" font-size="24" font-weight="700">Observe</text><text x="58" y="179" fill="#BFB7CF" font-size="14">Supported agent activity</text><path d="M302 143h16m-5-5 5 5-5 5" stroke="#BDA8FF" stroke-width="2"/><rect x="328" y="75" width="254" height="135" rx="12" fill="#25222F" stroke="#433953"/><text x="348" y="106" fill="#BDA8FF" font-size="13">02</text><text x="348" y="144" fill="#FFFFFF" font-size="24" font-weight="700">Verify</text><text x="348" y="179" fill="#BFB7CF" font-size="14">Your configured checks</text><path d="M592 143h16m-5-5 5 5-5 5" stroke="#BDA8FF" stroke-width="2"/><rect x="618" y="75" width="254" height="135" rx="12" fill="#25222F" stroke="#433953"/><text x="638" y="106" fill="#BDA8FF" font-size="13">03</text><text x="638" y="144" fill="#FFFFFF" font-size="24" font-weight="700">Recover</text><text x="638" y="179" fill="#BFB7CF" font-size="14">Retain, restore, retry</text><path d="M882 143h16m-5-5 5 5-5 5" stroke="#BDA8FF" stroke-width="2"/><rect x="908" y="75" width="254" height="135" rx="12" fill="#25222F" stroke="#433953"/><text x="928" y="106" fill="#BDA8FF" font-size="13">04</text><text x="928" y="144" fill="#FFFFFF" font-size="24" font-weight="700">Resolve</text><text x="928" y="179" fill="#BFB7CF" font-size="14">Verified or not verified</text><text x="38" y="252" fill="#A89FB7" font-size="14">Conceptual flow • observation and recovery capabilities depend on the integration.</text></g></svg>

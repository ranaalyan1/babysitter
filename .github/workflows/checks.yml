name: Runtime checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: mypy babysitter
      - run: git diff --check
      # Official-agent tests skip unless their explicitly installed executable
      # environment variables are provided. Never inject real provider credentials.

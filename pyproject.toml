[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babysitter-runtime"
version = "0.4.0"
description = "Local evidence-driven supervision for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "jsonschema>=4.23,<5", "json-repair>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "mypy>=1.13,<2", "types-jsonschema>=4.23"]

[project.urls]
Repository = "https://github.com/ranaalyan1/test0"

[project.scripts]
babysitter = "babysitter.cli:main"

[tool.setuptools.package-data]
babysitter = ["schema.sql", "claude_schema.sql", "codex_schema.sql", "web/*.html", "web/assets/*", "web/guides/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["babysitter*"]
